name: Generate Recipe Images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true olsa API cagirilmir, yalniz prompt-lar gosterilir"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_images:
        description: "Bu ishe salinmada max nece shekil yaradilsin"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U -r scripts/requirements.txt

      - name: Run image generation script
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          RECIPES_JSON_PATH: "recipes.json"
          IMAGES_DIR: "images"
          IMAGE_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/images"
          REPLICATE_MODEL: "black-forest-labs/flux-schnell"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_IMAGES_PER_RUN: ${{ github.event.inputs.max_images }}
        run: python scripts/generate_images.py

      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recipes.json images/
          git diff --staged --quiet && echo "Deyisiklik yoxdur" || git commit -m "Auto: generate recipe images"
          git push
