name: Generate Recipe Images

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: "Bu ish salinmada maksimum nece shekil yaradılsın"
        required: false
        default: "20"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U -r scripts/requirements.txt

      - name: Run image generation script
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          RECIPES_JSON_PATH: recipes.json
          IMAGES_DIR: images
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/images

          REPLICATE_MODEL: black-forest-labs/flux-schnell

          MAX_IMAGES_PER_RUN: ${{ github.event.inputs.max_images }}

        run: python scripts/generate_images.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add recipes.json images/

          git diff --staged --quiet \
            && echo "Deyisiklik yoxdur" \
            || git commit -m "Auto: generate recipe images"

          git push
