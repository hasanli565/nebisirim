```yaml
name: Generate Recipe Videos

on:
  workflow_dispatch:
    inputs:
      video_count:
        description: "Neçə yeni video hazırlansın?"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "20"

jobs:
  generate-videos:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install replicate python-dotenv requests

      - name: Generate recipe videos
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          VIDEO_COUNT: ${{ inputs.video_count }}
        run: python generate_video.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.json videos/
          if git diff --cached --quiet; then
            echo "Yeni dəyişiklik yoxdur."
          else
            git commit -m "Generate recipe videos"
            git push
          fi
```
