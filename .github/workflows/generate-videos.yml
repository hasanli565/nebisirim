```python
import os
import re
import json
import time
from pathlib import Path

import replicate
from dotenv import load_dotenv


# ============================================================
# AYARLAR
# ============================================================

BASE_DIR = Path(__file__).resolve().parent

JSON_FILE = BASE_DIR / "recipes.json"
VIDEOS_DIR = BASE_DIR / "videos"

# GitHub repository
GITHUB_RAW_BASE = (
    "https://raw.githubusercontent.com/"
    "hasanli565/nebisirim/main/videos/"
)

# Video parametrləri
VIDEO_WIDTH = 480
VIDEO_HEIGHT = 832

# Bir workflow işləyəndə maksimum neçə video yaradılsın?
# Test üçün 1 saxlayırıq.
MAX_VIDEOS_PER_RUN = 1


# ============================================================
# ENV
# ============================================================

load_dotenv(BASE_DIR / ".env")

REPLICATE_API_TOKEN = os.getenv("REPLICATE_API_TOKEN")

if not REPLICATE_API_TOKEN:
    raise RuntimeError(
        "REPLICATE_API_TOKEN tapilmadi. "
        ".env faylini veya GitHub Secret-i yoxla."
    )

os.environ["REPLICATE_API_TOKEN"] = REPLICATE_API_TOKEN


# ============================================================
# QOVLUQ
# ============================================================

VIDEOS_DIR.mkdir(parents=True, exist_ok=True)


# ============================================================
# FAYL ADI
# ============================================================

def safe_filename(text):
    """
    Resept adını fayl adı üçün təhlükəsiz formaya salır.
    """

    text = text.lower().strip()

    replacements = {
        "ə": "e",
        "ı": "i",
        "ö": "o",
        "ü": "u",
        "ğ": "g",
        "ş": "s",
        "ç": "c",
    }

    for old, new in replacements.items():
        text = text.replace(old, new)

    text = re.sub(r"[^a-z0-9]+", "-", text)
    text = text.strip("-")

    return text


# ============================================================
# JSON OXU
# ============================================================

with open(JSON_FILE, "r", encoding="utf-8") as f:
    recipes = json.load(f)


print("==========================================")
print(" NƏ BİŞİRİM - VIDEO GENERATOR")
print("==========================================")
print(f"Cəmi resept: {len(recipes)}")


# ============================================================
# VIDEO URL-İ BOŞ OLAN RESEPTLƏRİ TAP
# ============================================================

pending = []

for index, recipe in enumerate(recipes):

    name = recipe.get("name", "").strip()

    video_url = recipe.get("videoUrl", "")

    image_url = recipe.get("imageResource", "")

    # video artıq varsa keç
    if video_url:
        continue

    # şəkil yoxdursa video yaratmaq olmaz
    if not image_url:
        print(f"[SKIP] Şəkil yoxdur: {name}")
        continue

    if not name:
        print("[SKIP] Resept adı yoxdur")
        continue

    pending.append((index, recipe))


print(f"Video gözləyən resept: {len(pending)}")
print(f"Bu işə salmada maksimum: {MAX_VIDEOS_PER_RUN}")
print("==========================================")


# ============================================================
# HEÇ BİR RESEPT YOXDURSA
# ============================================================

if not pending:
    print("Bütün reseptlərin videoUrl sahəsi doludur.")
    print("Yeni video yaradılacaq resept yoxdur.")
    raise SystemExit(0)


# ============================================================
# REPLICATE
# ============================================================

client = replicate.Client(api_token=REPLICATE_API_TOKEN)


# ============================================================
# VIDEO GENERATION
# ============================================================

generated_count = 0

for index, recipe in pending:

    if generated_count >= MAX_VIDEOS_PER_RUN:
        break

    name = recipe["name"].strip()
    image_url = recipe["imageResource"].strip()

    slug = safe_filename(name)

    if not slug:
        print(f"[SKIP] Fayl adı yaradıla bilmədi: {name}")
        continue

    video_filename = f"{slug}.mp4"
    video_path = VIDEOS_DIR / video_filename

    print()
    print("------------------------------------------")
    print(f"Resept: {name}")
    print(f"Şəkil : {image_url}")
    print(f"Video : {video_filename}")
    print("------------------------------------------")

    # Əgər video artıq diskdə varsa, onu JSON-a bağla
    if video_path.exists() and video_path.stat().st_size > 0:

        print("[INFO] Video artıq mövcuddur.")

        recipe["videoUrl"] = GITHUB_RAW_BASE + video_filename

        with open(JSON_FILE, "w", encoding="utf-8") as f:
            json.dump(recipes, f, ensure_ascii=False, indent=2)

        generated_count += 1
        continue

    # ========================================================
    # PROMPT
    # ========================================================

    prompt = f"""
Create a realistic short food preparation video based on the dish "{name}".

Show the cooking process naturally and appetizingly.
Focus on the ingredients, pan, cooking movements and final dish.
Realistic food photography.
Natural kitchen environment.
Professional food video.
No text.
No subtitles.
No logos.
No people talking to camera.
Vertical video.
"""

    negative_prompt = """
cartoon,
animation,
illustration,
text,
subtitles,
watermark,
logo,
deformed food,
deformed hands,
extra fingers,
blurry,
low quality,
unrealistic ingredients
"""

    try:

        print("[INFO] Replicate video yaradır...")

        output = client.run(
            "wan-video/wan-2.2-5b-fast",
            input={
                "image": image_url,
                "prompt": prompt,
                "negative_prompt": negative_prompt,
                "num_frames": 81,
                "resolution": "480p",
                "aspect_ratio": "9:16",
                "go_fast": True,
                "sample_shift": 12,
                "frames_per_second": 16,
            }
        )

        print("[INFO] Video hazırdır.")

        # ====================================================
        # OUTPUT-U FAYLA YAZ
        # ====================================================

        if hasattr(output, "read"):

            with open(video_path, "wb") as f:
                f.write(output.read())

        elif isinstance(output, str):

            import requests

            response = requests.get(output, timeout=300)
            response.raise_for_status()

            with open(video_path, "wb") as f:
                f.write(response.content)

        else:

            # Replicate bəzi hallarda File obyektini qaytara bilər
            try:

                with open(video_path, "wb") as f:
                    f.write(output.read())

            except Exception as e:

                print("[ERROR] Video fayla yazila bilmədi.")
                print(e)
                continue

        # ====================================================
        # YOXLAMA
        # ====================================================

        if not video_path.exists() or video_path.stat().st_size == 0:

            print("[ERROR] Video faylı yaranmadı.")
            continue

        file_size_mb = video_path.stat().st_size / (1024 * 1024)

        print(f"[OK] Video saxlanıldı: {video_path}")
        print(f"[OK] Ölçü: {file_size_mb:.2f} MB")

        # ====================================================
        # JSON-a VIDEO URL
        # ====================================================

        video_url = GITHUB_RAW_BASE + video_filename

        recipe["videoUrl"] = video_url

        print(f"[OK] videoUrl: {video_url}")

        # ====================================================
        # JSON SAXLA
        # ====================================================

        with open(JSON_FILE, "w", encoding="utf-8") as f:
            json.dump(recipes, f, ensure_ascii=False, indent=2)

        print("[OK] recipes.json yeniləndi.")

        generated_count += 1

        # API-yə çox sürətli sorğular göndərməmək üçün
        time.sleep(2)

    except Exception as e:

        print()
        print("[ERROR] Video yaradılarkən xəta:")
        print(e)
        print()

        # Bir video uğursuz olsa, bütün sistemi dayandırmırıq.
        continue


# ============================================================
# SON
# ============================================================

print()
print("==========================================")
print(" TAMAMLANDI")
print("==========================================")
print(f"Yeni yaradılan video: {generated_count}")
print(f"Videolar qovluğu    : {VIDEOS_DIR}")
print("==========================================")
```
